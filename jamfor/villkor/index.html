<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Villkor – Jämför mina offerter</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:24px 16px;line-height:1.5;background:#f6f5f1;color:#161616}.sec h2{font-size:18px;margin:18px 0 4px}.sec p{white-space:pre-line;margin:0}.d{background:#fbf0d2;border:1px solid #b8860b66;border-radius:8px;padding:12px}</style></head>
<body><h1>Villkor och integritet – Jämför mina offerter</h1>
<p id="draftbox" class="d" hidden><b>UTKAST – inte slutgiltigt.</b> Villkorstexten nedan är inte fastställd.</p>
<div id="terms" class="sec" aria-live="polite"></div>
<p><a href="/jamfor/">← Tillbaka</a></p>
<footer><p>Jämför mina offerter är en tjänst från Ståhle Digital. <a class="fu" href="/foretagsuppgifter">Företagsuppgifter</a></p></footer>
<script>
// Den fullständiga villkorstexten ägs av servern (samma snapshot som ingår i samtyckeshashen och i bekräftelsen). Listan ovan är bara en checklista.
(function(){
  var H=location.hostname,box=document.getElementById('terms');
  var API=(H==='localhost'||H==='127.0.0.1')?(new URLSearchParams(location.search).get('api')||location.origin):'https://granskaminoffert-api.anders-316.workers.dev';
  function p(t,c){var e=document.createElement(c||'p');e.textContent=t;return e}
  fetch(API.replace(/\/$/,'')+'/compare/config').then(function(r){return r.json()}).then(function(c){
    var t=c&&c.terms;if(!t||!Array.isArray(t.sections))throw new Error('x');
    if(t.draft)document.getElementById('draftbox').hidden=false;
    box.appendChild(p('Villkorstext (version '+t.version+(t.draft?', UTKAST':'')+') – det här är exakt den text du godkänner vid köp.','h2'));
    var iu=t.seller&&t.seller.infoUrl;try{var xu=new URL(String(iu||''));if(xu.protocol==='https:'&&!xu.username&&!xu.password){document.querySelectorAll('a.fu').forEach(function(a){a.href=xu.href})}}catch(e){}
    t.sections.forEach(function(s){var d=document.createElement('div');d.appendChild(p(s.title,'h2'));d.appendChild(p(s.text));box.appendChild(d)});
  }).catch(function(){box.appendChild(p('Villkorstexten kunde inte hämtas just nu. Försök igen senare.'))});
})();
</script></body></html>
