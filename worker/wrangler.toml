name = "granskaminoffert-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV-namespace för 24h felsökningslagring och anonyma räknare.
# Id:t fylls i automatiskt av DEPLOY_GRANSKAMINOFFERT_WORKER.command
# (letar upp namespace med "REVIEWS" i namnet på kontot). Skapa annars med:
#   npx wrangler kv namespace create REVIEWS_KV
[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "65e71b59b2ce4f3aa4974b3a83bd92e4"

# Cloudflares egen räknare per IP (atomär). Första bromsen före KV-gränserna.
# 4 granskningar per minut och IP räcker för en människa som provar flera filer.
[[ratelimits]]
name = "REVIEW_RL"
namespace_id = "1002"
simple = { limit = 4, period = 60 }

# Tratten: uppladdning_start, granskning_fel, granskning_klar (2026-09-25). Inga personuppgifter.
[[analytics_engine_datasets]]
binding = "GRANSKA_H"
dataset = "granska_handelser"

[vars]
# D12: gratis-kostnadsskyddet är AV (nekar all gratisgenerering) tills en människa sätter ALLA fem värdena:
#   FREE_PILOT_ENABLED="1", FREE_PILOT_ID (a-z0-9-, 3–41 tecken), FREE_PILOT_CAP_MICRO (µUSD, TOTALT för perioden),
#   FREE_PILOT_FROM och FREE_PILOT_UNTIL (ISO med Z eller +hh:mm, max 92 dygn), FREE_PILOT_MANDATE (spårbar referens, 8–120 tecken, inga hemligheter).
FREE_PILOT_ENABLED = "0"
# Kommaseparerad lista om fler origins behövs (t.ex. under test).
ALLOWED_ORIGIN = "https://granskaminoffert.se"
# Modell. claude-sonnet-4-5-20250929 är "Deprecated" sedan 2026-09-30 med preliminärt
# avvecklingsdatum 2026-11-30 (platform.claude.com/docs/en/about-claude/model-deprecations,
# läst 2026-10-09); rekommenderad ersättare är claude-sonnet-5-5. Anropsformen väljs per modell
# i src/models.js. Träffsäkerheten på riktiga offerter med 5.5 är EJ TESTAT (F2). Byt tillbaka
# till den gamla raden nedan om F2 visar sämre resultat, så länge 4.5 finns kvar:
#   ANTHROPIC_MODEL = "claude-sonnet-4-5-20250929"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
# Teknisk spärr före betalt anrop (inte ett budgetbeslut): max antal indatatokens för fil-anrop,
# mätt med Anthropics gratis tokenräknare. Över gränsen startas ingen granskning.
INPUT_TOKEN_LIMIT = "60000"
MAX_UPLOAD_BYTES = "8000000"
RATE_LIMIT_PER_HOUR = "8"
# Globalt tak per dygn (UTC) för alla användare tillsammans. Kampanjbeslut 2026-09-17: 300.
# Måste vara ett heltal >= 0; allt annat stänger tjänsten (503) i stället för att gissa.
GLOBAL_DAILY_LIMIT = "300"

# POST /explain (AI-förklaring, Ägarkollen/Synlighetskollen). AV som standard: utan "1" görs inget AI-anrop,
# ingen org-kontroll, ingen Turnstile-kontroll och ingen budgetreservation; svaret är de fasta åtgärdstexterna.
# Modellen väljer bara slutna åtgärds-ID; ALL synlig text (intro, etikett, åtgärder) är fast servertext.
# Turnstile används bara OM secret TURNSTILE_SECRET_KOLLAR finns (då verifieras hostname + action "forklaring");
# utan den skyddas vägen av serverbegränsningarna (riktig CF-IP, atomisk 20 USD/månad, dag 100, IP 5) som publika /review.
# Nya AI-anrop kräver dessutom lyckad org-kontroll (S4) och att krediten inte gått ut (EXPLAIN_CREDIT_UNTIL, standard 2026-10-14).
# Aktiveras först efter oberoende test + separat release-GO. Egen CORS (inte ALLOWED_ORIGIN).
EXPLAIN_ENABLED = "0"
EXPLAIN_ALLOWED_ORIGIN = "https://stahledigital.se"

# Secret (ALDRIG i denna fil, aldrig i repo):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   (valfritt för /explain, bara om Turnstile ska användas:) npx wrangler secret put TURNSTILE_SECRET_KOLLAR

# Atomärt globalt dagstak (F8/N22): en SQLite-backad Durable Object-instans räknar och är enda
# skrivare. Globala betalda anrop KRÄVER denna bindning; utan den svarar Workern 503 och gör
# inget betalt anrop (src/quota.js). SQLite-backade Durable Objects finns på Cloudflares Free- och
# Paid-planer (developers.cloudflare.com/durable-objects/platform/pricing/, läst 2026-10-09).
# Detta är lokal konfiguration i repot: ingen molnresurs skapas förrän `wrangler deploy` körs,
# och migrationen skapar klassen i samband med den. Publicering kräver separat release-GO.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# AI-förklaring för Ägarkollen/Synlighetskollen (POST /explain, S3). EGET atomärt utgiftstak (20 USD/månad),
# skilt från GMO:s QUOTA. Ny klass kräver migration v2; ingen molnresurs skapas förrän `wrangler deploy`.
[[durable_objects.bindings]]
name = "EXPLAIN_BUDGET"
class_name = "ExplainBudget"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ExplainBudget"]

# D12: ÄNDLIGT, atomärt kostnadsskydd för gratisgenerationer (/review och /explain), src/free_budget.js. EN pott per pilot-id (en SQLite-DO-instans
# per id, enda skrivare), ett TOTALT tak i µUSD och en giltighetsperiod [FROM, UNTIL) – inget kalenderomslag, ingen ny pott vid månadsskifte.
# Utan aktivering och giltig konfiguration NEKAS alla gratisgenerationer (503, tillfälligt stängd). Sätt värdena via `wrangler deploy --var`
# eller dashboard först efter ett MÄNSKLIGT beslut; inga värden finns här. Se worker/FREE_GATE.md. Taket/slutet kan för samma pilot-id bara sänkas.
[[durable_objects.bindings]]
name = "FREE_BUDGET"
class_name = "FreeBudget"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FreeBudget"]

# ---- Valfritt, INTE aktiverat ----
