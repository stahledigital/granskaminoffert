name = "granskaminoffert-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
keep_vars = true

# MR PRO-schema (KP-2026-10-16-01): bekräftelser, förnyelsekvitton, årspåminnelser och nya försök med ångeråtgärder.
# I PRO_PAYMENTS="off" returnerar proSchema direkt utan nätanrop och utan KV.
[triggers]
crons = ["17 * * * *"]

# KV-namespace för 24h felsökningslagring och anonyma räknare.
# Id:t fylls i automatiskt av DEPLOY_GRANSKAMINOFFERT_WORKER.command
# (letar upp namespace med "REVIEWS" i namnet på kontot). Skapa annars med:
#   npx wrangler kv namespace create REVIEWS_KV
[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "65e71b59b2ce4f3aa4974b3a83bd92e4"

# Cloudflares egen räknare per IP (atomär). Första bromsen före KV-gränserna.
# 4 granskningar per minut och IP räcker för en människa som provar flera filer.
[[ratelimits]]
name = "REVIEW_RL"
namespace_id = "1002"
simple = { limit = 4, period = 60 }

# Tratten: uppladdning_start, granskning_fel, granskning_klar (2026-09-25). Inga personuppgifter.
[[analytics_engine_datasets]]
binding = "GRANSKA_H"
dataset = "granska_handelser"

[vars]
# D12: gratis-kostnadsskyddet är AV (nekar all gratisgenerering) tills en människa sätter ALLA fem värdena:
#   FREE_PILOT_ENABLED="1", FREE_PILOT_ID (a-z0-9-, 3–41 tecken), FREE_PILOT_CAP_MICRO (µUSD, TOTALT för perioden),
#   FREE_PILOT_FROM och FREE_PILOT_UNTIL (ISO med Z eller +hh:mm, max 92 dygn), FREE_PILOT_MANDATE (spårbar referens, 8–120 tecken, inga hemligheter).
FREE_PILOT_ENABLED = "1"
# Kommaseparerad lista om fler origins behövs (t.ex. under test).
ALLOWED_ORIGIN = "https://granskaminoffert.se"
# Modell. claude-sonnet-4-5-20250929 är "Deprecated" sedan 2026-09-30 med preliminärt
# avvecklingsdatum 2026-11-30 (platform.claude.com/docs/en/about-claude/model-deprecations,
# läst 2026-10-09); rekommenderad ersättare är claude-sonnet-5-5. Anropsformen väljs per modell
# i src/models.js. Träffsäkerheten på riktiga offerter med 5.5 är EJ TESTAT (F2). Byt tillbaka
# till den gamla raden nedan om F2 visar sämre resultat, så länge 4.5 finns kvar:
#   ANTHROPIC_MODEL = "claude-sonnet-4-5-20250929"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
# Teknisk spärr före betalt anrop (inte ett budgetbeslut): max antal indatatokens för fil-anrop,
# mätt med Anthropics gratis tokenräknare. Över gränsen startas ingen granskning.
INPUT_TOKEN_LIMIT = "60000"
MAX_UPLOAD_BYTES = "8000000"
RATE_LIMIT_PER_HOUR = "8"
# Globalt tak per dygn (UTC) för alla användare tillsammans. Kampanjbeslut 2026-09-17: 300.
# Måste vara ett heltal >= 0; allt annat stänger tjänsten (503) i stället för att gissa.
GLOBAL_DAILY_LIMIT = "300"

# POST /explain (AI-förklaring, Ägarkollen/Synlighetskollen). AV som standard: utan "1" görs inget AI-anrop,
# ingen org-kontroll, ingen Turnstile-kontroll och ingen budgetreservation; svaret är de fasta åtgärdstexterna.
# Modellen väljer bara slutna åtgärds-ID; ALL synlig text (intro, etikett, åtgärder) är fast servertext.
# Turnstile används bara OM secret TURNSTILE_SECRET_KOLLAR finns (då verifieras hostname + action "forklaring");
# utan den skyddas vägen av serverbegränsningarna (riktig CF-IP, atomisk 20 USD/månad, dag 100, IP 5) som publika /review.
# Nya AI-anrop kräver dessutom lyckad org-kontroll (S4) och att krediten inte gått ut (EXPLAIN_CREDIT_UNTIL, standard 2026-10-14).
# Aktiveras först efter oberoende test + separat release-GO. Egen CORS (inte ALLOWED_ORIGIN).
EXPLAIN_ENABLED = "0"
EXPLAIN_ALLOWED_ORIGIN = "https://stahledigital.se"

# Secret (ALDRIG i denna fil, aldrig i repo):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   (valfritt för /explain, bara om Turnstile ska användas:) npx wrangler secret put TURNSTILE_SECRET_KOLLAR

# Atomärt globalt dagstak (F8/N22): en SQLite-backad Durable Object-instans räknar och är enda
# skrivare. Globala betalda anrop KRÄVER denna bindning; utan den svarar Workern 503 och gör
# inget betalt anrop (src/quota.js). SQLite-backade Durable Objects finns på Cloudflares Free- och
# Paid-planer (developers.cloudflare.com/durable-objects/platform/pricing/, läst 2026-10-09).
# Detta är lokal konfiguration i repot: ingen molnresurs skapas förrän `wrangler deploy` körs,
# och migrationen skapar klassen i samband med den. Publicering kräver separat release-GO.

# GMO Premium: USER live-GO 2026-10-11. Köpen förblir stängda tills riktiga secrets, mailproof och slutlig P-snapshot finns.
FREE_PILOT_ID = "gmo-free-20261011"
FREE_PILOT_CAP_MICRO = "20000000"
FREE_PILOT_FROM = "2026-10-11T00:10:38+02:00"
FREE_PILOT_UNTIL = "2026-11-01T00:00:00+01:00"
FREE_PILOT_MANDATE = "ANDERS-2026-10-10T23:36:49+02:00 kor-pa-det"
COMPARE_ENABLED = "1"
COMPARE_PAYMENTS = "live"
COMPARE_CONSENT_POLICY = "P"
COMPARE_FULFILMENT_POINT = "leverans"
COMPARE_PAYMENT_METHODS = "card"
COMPARE_RETURN_URL = "https://granskaminoffert.se/jamfor/"
COMPARE_SELLER_FORM = "ENSKILD"
COMPARE_SELLER_NAME = "Ståhle Digital"
COMPARE_SELLER_OWNER_NAME = "Anders Ståhle"
COMPARE_SELLER_EMAIL = "hej@stahledigital.se"
COMPARE_SELLER_ADDRESS = "Vikaholmsallén 2 E, 352 20 Växjö"
COMPARE_SELLER_PHONE = "+46768525947"
COMPARE_COMPANY_INFO_URL = "https://granskaminoffert.se/foretagsuppgifter/"
COMPARE_LEDGER_RETENTION_DAYS = "430"
COMPARE_BOOKKEEPING_RETENTION_DAYS = "2930"
COMPARE_MONTH_CAP_MICRO = "20000000"
COMPARE_PAID_CAP_MICRO = "15000000"
COMPARE_ORDER_CAP_MICRO = "800000"
COMPARE_DAY_ORDERS = "10"
COMPARE_MAIL_HTTP = "1"
COMPARE_MAIL_HTTP_VERIFIED = "1"
COMPARE_MAIL_FROM = "Granska min offert <hej@stahledigital.se>"
COMPARE_MAIL_DAY_CAP = "20"
# D19 (2026-10-16): källvärdena synkade med faktisk produktion (BÅDA redan "1" live, API-UUID d88716f3-…, BUILD_ID 7cbe991).
# Bevarar dagens erbjudande och samtyckeshash vid ordinarie släpp; aktiverar ingen ny funktion. keep_vars=true är oförändrat.
COMPARE_REVIEWS = "1"
COMPARE_REVIEWS_VERIFIED = "1"
COMPARE_PREID = "0"
COMPARE_AUTO_REFUND = "1"
# MR PRO (KP-2026-10-16-01), /pro/* i src/pro_routes.js. off = köp stängt: /pro/status svarar, övriga /pro/* 503, inga Stripe-/Resend-anrop.
# Läget test/live sätts först efter separat QA och SLÄPPREDO (PRO_INTEGRATION D.3–D.4). PRO_KAMPANJKODER är av när den saknas.
PRO_PAYMENTS = "off"
PRO_ALLOWED_ORIGIN = "https://stahledigital.se"
# KONTO-SYNK K1 (KP-2026-10-16-01): konto, engångskod och sessioner under /pro/konto/*. off = 503 för allt där, inga mejl, inga DO-anrop.
# "inbjudna" = koder bara till ägaren och aktiva testbevis; övriga får samma 202 utan mejl. Läget ändras först i K6 enligt specen.
PRO_KONTO = "off"
PRO_OWNER_EMAIL = "anders@stahledigital.se"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# AI-förklaring för Ägarkollen/Synlighetskollen (POST /explain, S3). EGET atomärt utgiftstak (20 USD/månad),
# skilt från GMO:s QUOTA. Ny klass kräver migration v2; ingen molnresurs skapas förrän `wrangler deploy`.
[[durable_objects.bindings]]
name = "EXPLAIN_BUDGET"
class_name = "ExplainBudget"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ExplainBudget"]

# D12: ÄNDLIGT, atomärt kostnadsskydd för gratisgenerationer (/review och /explain), src/free_budget.js. EN pott per pilot-id (en SQLite-DO-instans
# per id, enda skrivare), ett TOTALT tak i µUSD och en giltighetsperiod [FROM, UNTIL) – inget kalenderomslag, ingen ny pott vid månadsskifte.
# Utan aktivering och giltig konfiguration NEKAS alla gratisgenerationer (503, tillfälligt stängd). Sätt värdena via `wrangler deploy --var`
# eller dashboard först efter ett MÄNSKLIGT beslut; inga värden finns här. Se worker/FREE_GATE.md. Taket/slutet kan för samma pilot-id bara sänkas.
[[durable_objects.bindings]]
name = "FREE_BUDGET"
class_name = "FreeBudget"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FreeBudget"]

# ---- Valfritt, INTE aktiverat ----
# Begränsning av klienthändelser (/event), samma slags bindning som REVIEW_RL:
#   [[ratelimits]]
#   name = "EVENT_RL"
#   namespace_id = "1003"
#   simple = { limit = 30, period = 60 }
#
# BUILD_ID sätts vid publicering av DEPLOY_GRANSKAMINOFFERT_WORKER.command (--var BUILD_ID:...)
# och visas i /health, så att live-versionen går att jämföra mot en exakt commit.

# ---- Jämför mina offerter (D04) – KOMMENTERAT, INTE AKTIVERAT ----
# Aktiveras först efter separat release-GO. Kräver också secrets STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
# och människosatta tak (COMPARE_*_CAP_MICRO, se COMPARE.md). Ingen resurs skapas förrän `wrangler deploy`.
#   [[durable_objects.bindings]]
#   name = "COMPARE_ORDERS"
#   class_name = "CompareOrders"
#   [[durable_objects.bindings]]
#   name = "COMPARE_BUDGET"
#   class_name = "CompareBudget"
#   [[migrations]]
#   tag = "v4"   # v3 = FreeBudget (D12, LIVE sedan 2026-10-11); betalmigrationen måste komma EFTER den
#   new_sqlite_classes = ["CompareOrders", "CompareBudget"]
# Kostnadsgate: /review, /explain OCH betalda jämförelsegenerationer reserverar i EN gemensam pott (D12 FreeBudget, pilot-id). Ingen separat/extra pott för betald trafik; COMPARE_*_CAP_MICRO är ENDAST extra, lägre per-scope/order-tak (människosatta).
# OBS: koden exporterar redan klasserna, men utan bindningarna ovan och COMPARE_ENABLED="1" gör /compare ingenting (503).
# Valfritt: [[ratelimits]] name = "COMPARE_RL" namespace_id = "1004" simple = { limit = 6, period = 60 }

# D07 (omdömeskällor, ALLA AV; inga värden satta här, inga hemligheter i repo):
#   COMPARE_REVIEWS=1 + COMPARE_REVIEWS_VERIFIED=1 (människa: villkor/licens/kostnad verifierade)
#   Google: GOOGLE_UI_KIT=1, GOOGLE_MAPS_BROWSER_KEY (publik, domän-/API-begränsad – INTE ett USD-tak), COMPARE_SOURCES_SEARCH_DAY_CAP (native UI Kit-sök räknas mot det),
#           servermässig Text Search (EJ UI Kit-undantaget): GOOGLE_CANDIDATES=1 + GOOGLE_PLACES_API_SEARCH_VERIFIED=1 (extra mänsklig flagga) + GOOGLE_PLACES_SERVER_KEY (secret)
#   Trustpilot: TRUSTPILOT_DISPLAY=1, TRUSTPILOT_API_BASE, TRUSTPILOT_API_KEY (secret), TRUSTPILOT_AUTH_HEADER, COMPARE_TP_DAY_CAP, COMPARE_TP_CACHE_MIN (≤1440)

# D10: betalmetoder: COMPARE_PAYMENT_METHODS=card (standard) | card,swish | dynamic; Swish/dynamic kräver även COMPARE_SWISH_VERIFIED=1 (människa, kontoåtkomst verifierad). Ändrar inte Stripe-kontots metoder.
# D09: Google-instanser kräver reservation: COMPARE_SOURCES_MOUNT_DAY_CAP (gemensamt) + COMPARE_SOURCES_SEARCH_DAY_CAP / COMPARE_SOURCES_DETAILS_DAY_CAP (per SKU), människosatta; saknas ⇒ stängt.
# Verklig mejltransport (HTTP-adapter, DEFAULT AV, inga värden satta här): COMPARE_MAIL_HTTP=1, COMPARE_MAIL_HTTP_VERIFIED=1, COMPARE_MAIL_FROM, COMPARE_MAIL_DAY_CAP (>0) och secrets COMPARE_MAIL_API_KEY + COMPARE_MAIL_WEBHOOK_SECRET (Resend-webhookens whsec_…, D14) krävs ALLA – en nyckel ensam aktiverar inget; HTTP "sent" ensamt öppnar aldrig startgrinden (signerad delivered krävs). Route: POST /compare/mail-events.
# D08b: avtalsbekräftelsen kräver transport: COMPARE_MAILER-bindning (AV tills människa kopplar) – eller, ENDAST i test, COMPARE_MAILER_MODE=mock (nekas i live).
# D06-rättning (inga värden satta här): säljare COMPARE_SELLER_FORM(AB|ENSKILD)/NAME/OWNER_NAME(ENSKILD)/ORGNR(endast AB)/EMAIL/ADDRESS/PHONE/VAT(valfri), COMPARE_COMPANY_INFO_URL (https), COMPARE_CONFIRM_SHOW_VAT (standard 0) – alla krävs för live utom VAT, COMPARE_ADMIN_TOKEN (secret),
#   retention COMPARE_LEDGER_RETENTION_DAYS + COMPARE_BOOKKEEPING_RETENTION_DAYS (människa; saknas ⇒ svepet gör ingenting och live är stängt).

# D04: samma Worker, två SQLite-klasser efter redan befintlig FreeBudget v3.
[[durable_objects.bindings]]
name = "COMPARE_ORDERS"
class_name = "CompareOrders"

[[durable_objects.bindings]]
name = "COMPARE_BUDGET"
class_name = "CompareBudget"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CompareOrders", "CompareBudget"]

# KONTO-SYNK K1: kontoregister (EN instans) och ett objekt per konto (enheter och sessioner). SQLite-backade, ingen ny molnresurs utöver klasserna.
[[durable_objects.bindings]]
name = "PRO_REGISTER"
class_name = "ProRegister"

[[durable_objects.bindings]]
name = "PRO_KONTON"
class_name = "ProKonto"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ProRegister", "ProKonto"]
