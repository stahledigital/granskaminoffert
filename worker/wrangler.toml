#   [[ratelimits]]
#   name = "EVENT_RL"
#   namespace_id = "1003"
#   simple = { limit = 30, period = 60 }
#
# BUILD_ID sätts vid publicering av DEPLOY_GRANSKAMINOFFERT_WORKER.command (--var BUILD_ID:...)
# och visas i /health, så att live-versionen går att jämföra mot en exakt commit.
