name = "granskaminoffert-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV-namespace för 24h felsökningslagring (Anders beslut 2026-09-14).
# Skapa med: wrangler kv namespace create REVIEWS_KV
# och klistra in det id:t som visas här innan deploy.
[[kv_namespaces]]
binding = "REVIEWS_KV"
id = "REPLACE_AFTER_WRANGLER_KV_NAMESPACE_CREATE"

[vars]
# Kommaseparerad lista om fler origins behövs (t.ex. under test).
ALLOWED_ORIGIN = "https://granskaminoffert.se"
ANTHROPIC_MODEL = "claude-sonnet-4-5-20250929"
MAX_UPLOAD_BYTES = "8000000"
RATE_LIMIT_PER_HOUR = "8"

# Secret (ALDRIG i denna fil, aldrig i repo):
#   wrangler secret put ANTHROPIC_API_KEY
